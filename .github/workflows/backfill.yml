name: Backfill price history

# One-off (re-runnable) load of NSE bhavcopy history into data/history/. Run it from the Actions tab.
# If NSE's archive host refuses GitHub's IP range the job fails fast; then run BACKFILL.md locally instead.
on:
  workflow_dispatch:
    inputs:
      years:
        description: 'How many years back to load'
        required: true
        default: '2'
      universe:
        description: 'nifty500 | nifty50 | all'
        required: true
        default: 'nifty500'

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Download history from NSE archives
        run: node scripts/backfill.mjs --years ${{ github.event.inputs.years }} --universe ${{ github.event.inputs.universe }} --pause 700
      - name: Commit history
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "swing-desk-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "data: history backfill (${{ github.event.inputs.years }}y, ${{ github.event.inputs.universe }})" && git pull --rebase origin main && git push; fi
      # Telegram alert when the run fails (21 Nov 2026). Uses the two secrets the daily digest uses; without them it does nothing.
      - name: Telegram alert if this run failed
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WHAT: ${{ github.workflow }} #${{ github.run_number }} (${{ github.event_name }})
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then echo "telegram not configured"; exit 0; fi
          TEXT="⚠ Nifty Swing Desk — $WHAT failed at $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M') IST. Nothing was saved by this run; the next scheduled run tries again, or use Run workflow.
          Log: $RUN_URL"
          curl -sS --max-time 20 -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${TEXT}" -d disable_web_page_preview=true || echo "telegram alert not sent"
