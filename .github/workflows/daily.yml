name: Daily NSE snapshot

on:
  schedule:
    # Target 18:00 IST Mon–Fri (= 12:30 UTC). NSE closes 15:30 IST; the market-watch data settles by ~16:00.
    # GitHub's scheduler ran the single 12:30 UTC slot 3–6 hours late every day in the week of 21–29 Oct 2026 (digest at 21:00–00:00 IST),
    # so there are now four slots half an hour apart. The first one that actually runs saves the snapshot and sends the digest; the later
    # ones see the same NSE timestamp and exit without doing anything (fetch.mjs: "snapshot unchanged"), so there is never a second digest.
    # If this is still too late, the reliable fix is an outside clock that calls workflow_dispatch — see README, "When the digest is late".
    - cron: '32 12 * * 1-5'
    - cron: '2 13 * * 1-5'
    - cron: '32 13 * * 1-5'
    - cron: '2 14 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force: re-save today even if unchanged and send the Telegram digest (use to test alerts)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Fetch NSE data and compute signals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/fetch.mjs ${{ github.event.inputs.force == 'true' && '--force' || '' }}
      # pull --rebase first: if something was merged to main while this run was fetching, the push would otherwise be rejected and the run's data lost
      - name: Commit snapshot
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "swing-desk-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "data: snapshot $(date -u +%Y-%m-%d)" && git pull --rebase origin main && git push; fi
