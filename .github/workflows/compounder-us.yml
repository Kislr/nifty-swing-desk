name: Compounder US fundamentals

on:
  schedule:
    # Quarterly, a few weeks after each 10-K/10-Q wave: 15 Jan / Apr / Jul / Oct at 02:30 UTC (08:00 IST)
    - cron: '30 2 15 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Only the first N companies (0 = all). Use 50 for a quick test run.'
        type: number
        default: 0
      fresh:
        description: 'Ignore the existing store and refetch everything'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: compounder-us
  cancel-in-progress: false

jobs:
  fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build universe and pull EDGAR company facts
        env:
          # SEC fair-access policy asks for a User-Agent naming who you are: Settings → Secrets and variables → Actions → Variables → EDGAR_USER_AGENT
          EDGAR_USER_AGENT: ${{ vars.EDGAR_USER_AGENT }}
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          FRESH="${{ github.event.inputs.fresh }}"
          ARGS="--all"
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          if [ "$FRESH" = "true" ]; then ARGS="$ARGS --fresh"; fi
          node scripts/compounder-fetch-us.mjs $ARGS
      - name: Run the screen on the fresh store
        run: node scripts/compounder-screen.mjs
      - name: Commit the store and the screen
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "swing-desk-bot@users.noreply.github.com"
          git add compounder/data reports
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "data: compounder US fundamentals $(date -u +%Y-%m-%d)" && git pull --rebase origin main && git push; fi
      # Telegram alert when the run fails (21 Nov 2026). Uses the two secrets the daily digest uses; without them it does nothing.
      - name: Telegram alert if this run failed
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WHAT: ${{ github.workflow }} #${{ github.run_number }} (${{ github.event_name }})
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then echo "telegram not configured"; exit 0; fi
          TEXT="⚠ Nifty Swing Desk — $WHAT failed at $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M') IST. Nothing was saved by this run; the next scheduled run tries again, or use Run workflow.
          Log: $RUN_URL"
          curl -sS --max-time 20 -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${TEXT}" -d disable_web_page_preview=true || echo "telegram alert not sent"
