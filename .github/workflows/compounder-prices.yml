name: Compounder US prices

on:
  schedule:
    # Every weekday at 22:40 UTC (after the 21:00 UTC US close; 04:10 IST next morning). Then re-runs the screen.
    - cron: '40 22 * * 1-5'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Backfill history for every symbol (first run, or after a gap)'
        type: boolean
        default: false
      years:
        description: 'Years of history to backfill (6 = default; 12 for the compounder backtest, ~45 quarterly cohorts)'
        type: number
        default: 6
      limit:
        description: 'Only the first N symbols (0 = all). Use 50 for a quick test.'
        type: number
        default: 0

permissions:
  contents: write

concurrency:
  group: compounder-us
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Pull prices
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then ARGS="$ARGS --backfill"; fi
          YEARS="${{ github.event.inputs.years }}"
          if [ -n "$YEARS" ] && [ "$YEARS" != "6" ]; then ARGS="$ARGS --years $YEARS"; fi
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          node scripts/compounder-prices-us.mjs $ARGS
      - name: Re-run the screen with prices
        run: node scripts/compounder-screen.mjs
      - name: Commit
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "swing-desk-bot@users.noreply.github.com"
          git add compounder/data reports
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "data: compounder US prices $(date -u +%Y-%m-%d)" && git pull --rebase origin main && git push; fi
