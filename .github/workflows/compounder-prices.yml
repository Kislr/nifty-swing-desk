name: Compounder US prices

on:
  schedule:
    # Every weekday at 22:40 UTC (after the 21:00 UTC US close; 04:10 IST next morning). Then re-runs the screen.
    - cron: '40 22 * * 1-5'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Backfill history for every symbol (first run, or after a gap)'
        type: boolean
        default: false
      years:
        description: 'Years of history to backfill (6 = default; 12 for the compounder backtest, ~45 quarterly cohorts)'
        type: number
        default: 6
      limit:
        description: 'Only the first N symbols (0 = all). Use 50 for a quick test.'
        type: number
        default: 0

permissions:
  contents: write

concurrency:
  group: compounder-us
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Pull prices
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then ARGS="$ARGS --backfill"; fi
          YEARS="${{ github.event.inputs.years }}"
          if [ -n "$YEARS" ] && [ "$YEARS" != "6" ]; then ARGS="$ARGS --years $YEARS"; fi
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          node scripts/compounder-prices-us.mjs $ARGS
      - name: Re-run the screen with prices
        run: node scripts/compounder-screen.mjs
      - name: Commit
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "swing-desk-bot@users.noreply.github.com"
          git add compounder/data reports
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "data: compounder US prices $(date -u +%Y-%m-%d)" && git pull --rebase origin main && git push; fi
      # Telegram alert when the run fails (21 Nov 2026). Uses the two secrets the daily digest uses; without them it does nothing.
      - name: Telegram alert if this run failed
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WHAT: ${{ github.workflow }} #${{ github.run_number }} (${{ github.event_name }})
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then echo "telegram not configured"; exit 0; fi
          TEXT="⚠ Nifty Swing Desk — $WHAT failed at $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M') IST. Nothing was saved by this run; the next scheduled run tries again, or use Run workflow.
          Log: $RUN_URL"
          curl -sS --max-time 20 -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${TEXT}" -d disable_web_page_preview=true || echo "telegram alert not sent"
